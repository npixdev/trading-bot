# Configuration par défaut. Les options de la ligne de commande la surchargent.
# Aucune clé API ici : elles vont dans .env (voir .env.example).

data:
  # Source de l'historique : Binance a l'historique BTC/USDT le plus long et le plus liquide.
  # Données publiques, aucun compte nécessaire.
  exchange: binance
  symbol: BTC/USDT
  timeframe: 1h
  since: "2021-01-01"
  dir: data

backtest:
  fee: 0.001          # 0,10 % par ordre = taker OKX au palier de base
  slippage: 0.0005    # 0,05 % : pessimiste pour du BTC en petite taille
  initial_cash: 10000

risk:
  sizing: atr               # "atr" : taille calculée pour risquer risk_per_trade ; "fixed" : position_fraction
  position_fraction: 1.0    # (sizing fixed) part du capital par trade
  risk_per_trade: 0.01      # 1 % du capital perdu si le stop est touché (hors gap)
  atr_period: 14
  stop_atr_mult: 3.0        # stop à 3 ATR sous le prix d'entrée
  stop_pct: null            # alternative : stop à x % sous l'entrée (exclusif avec stop_atr_mult)
  max_exposure: 1.0         # plafond d'investissement ; > 1 refusé (= levier)
  exposure_tolerance: 0.05  # dérive tolérée au-dessus du plafond avant de revendre le surplus
  daily_loss_limit: 0.05    # −5 % depuis minuit UTC → tout vendre, pause jusqu'au lendemain
  kill_switch_drawdown: 0.30  # −30 % depuis le plus haut → tout vendre, arrêt définitif

paper:
  # Paper trading : prix réels de trading.exchange, portefeuille fictif, AUCUN ordre envoyé.
  # Stratégie validée par la recherche pré-enregistrée (docs/RECHERCHE.md, H1) : filtre de tendance
  # dont la fenêtre (50/100/150/200 j) est re-choisie chaque trimestre sur le meilleur Sharpe de l'année écoulée.
  # BTC/USDT et non BTC/USDC : OKX ne garde que ~470 jours d'historique journalier BTC/USDC, or la stratégie
  # en demande ≥ 565 (365 j d'entraînement + 200 j de moyenne). Même prix à quelques dollars près, et c'est
  # la paire de la recherche. (L'USDT n'est restreint en Europe que pour le trading réel.)
  exchange: okx
  symbol: BTC/USDT
  timeframe: 1d
  strategy: trend_adaptive
  params: {}
  initial_cash: 10000
  poll_seconds: 60          # tour complet de sécurité ; le stop et la clôture sont suivis en temps réel
  warmup_bars: 800          # 365 j d'entraînement + 200 j pour la plus longue moyenne + marge
  db: data/paper.sqlite
  use_risk: true
  risk_overrides:
    # Garde-fous alignés sur la stratégie TESTÉE : ni taille ATR ni stop (non testés, ils en feraient une
    # autre stratégie). Kill switch juste au-delà de la pire chute observée hors échantillon (−53 %).
    sizing: fixed
    position_fraction: 1.0
    stop_atr_mult: null
    daily_loss_limit: null
    kill_switch_drawdown: 0.60

sandbox:
  # Bac à sable (python -m bot sandbox) : paper trading RAPIDE pour s'amuser et apprendre, à côté du bot
  # sérieux. Stratégie NON validée : en 1 minute, les frais dépassent les mouvements de prix (étapes 1 et 3).
  # Telegram séparé : TELEGRAM_SANDBOX_BOT_TOKEN / TELEGRAM_SANDBOX_CHAT_ID dans .env (un 2e bot @BotFather).
  exchange: okx
  symbol: BTC/USDT
  timeframe: 1m
  strategy: sma
  params: {fast: 5, slow: 20}
  initial_cash: 10000
  poll_seconds: 60
  warmup_bars: 300
  db: data/sandbox.sqlite
  use_risk: true
  risk_overrides: {}        # garde-fous de la section risk (taille ATR, stop 3 ATR, limite 5 %/jour, kill switch 30 %)

execution:
  # Ordres réels : testnet par défaut, live uniquement avec --live + confirmation au clavier.
  # Stratégie, timeframe et garde-fous : ceux de la section paper.
  # Testnet : Binance spot testnet (testnet.binance.vision), fonds fictifs, sans compte Binance ni KYC.
  # Live : trading.exchange / trading.symbol (OKX). Les prix du testnet viennent de son propre carnet.
  testnet_exchange: binance
  testnet_symbol: BTC/USDT
  max_capital: 100         # USDC max gérés par le bot (le reste du compte est ignoré pour le sizing)
  max_slippage: 0.002       # ordres limit IOC plafonnés à ask + 0,2 % (achat) / bid − 0,2 % (vente)
  order_timeout: 15
  testnet_db: data/testnet.sqlite
  live_db: data/live.sqlite

trading:
  # Exchange utilisé pour paper/testnet/live (étapes 5+). OKX : agréé MiCA, mode démo via ccxt.
  exchange: okx
  symbol: BTC/USDC
