# Configuration par défaut. Les options de la ligne de commande la surchargent.
# Aucune clé API ici : elles vont dans .env (voir .env.example).

data:
  # Source de l'historique : Binance a l'historique BTC/USDT le plus long et le plus liquide.
  # Données publiques, aucun compte nécessaire.
  exchange: binance
  symbol: BTC/USDT
  timeframe: 1h
  since: "2021-01-01"
  dir: data

backtest:
  fee: 0.001          # 0,10 % par ordre = taker OKX au palier de base
  slippage: 0.0005    # 0,05 % : pessimiste pour du BTC en petite taille
  initial_cash: 10000

trading:
  # Exchange utilisé pour paper/testnet/live (étapes 5+). OKX : agréé MiCA, mode démo via ccxt.
  exchange: okx
  symbol: BTC/USDC
