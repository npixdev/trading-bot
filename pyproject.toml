[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "bot"
version = "0.1.0"
description = "Bot de trading crypto spot, pédagogique"
requires-python = ">=3.11"
dependencies = [
    "ccxt>=4.4",
    "pandas>=2.2",
    "pyarrow>=15",
    "pyyaml>=6",
    "python-dotenv>=1",
    "requests>=2.31",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bot = ["report/template.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
